<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Berpeganglah Kalian kepada atsar dan jalan salaf!</title>
        <link rel="stylesheet" href="flip.css">
        <style>
            html{
                scroll-behavior: smooth;
            }
            body{
                font-family: Arial, sans-serif;
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f4f4f4;
                touch-action: manipulation;
                overflow-x: hidden;
            }
            
            .navbar{
                position: fixed;
                top: 18px;
                left: 50%;
                transform:  translateX(-50%);
                width: min(1120px, calc(100% - 30px));
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 13px 18px;
                background: rgba(35, 45, 70, 0.72);
                border: 1px solid rgba(225,255,255,.08);
                box-shadow: 0 15px 40px rgba(0,0,0,.15);
            }

           
            .avatar{
                vertical-align: middle;
                width: 50px;
                height: 50px;
                border-radius: 50%;
            }

            .flip-card{
                background-color: transparent;
                width: 420px;
                height: 420px;
                perspective: 1000px;
                cursor: pointer;
                margin: 0 auto;
            }
            .flip-card-inner{
                position: relative;
                width: 100%;
                height: 100%;
                text-align: center;
                transition: transform 0.6s;
                transform-style: preserve-3d;
                box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
            }
            .flip-card:hover .flip-card-inner{
                transform: rotateY(180deg);
            }
            .flip-card-front, .flip-card-back{
                position: absolute;
                width: 100%;
                height: 100%;
                -webkit-backface-visibility: hidden;
                backface-visibility: hidden;
            }
            .flip-card-front{
                background-color: #bbb;
                color: black;
            }
            .flip-card-back{
                background-color: #2980b9;
                color: white;
                transform: rotateY(180deg);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .flip-card-back h1{
                margin: 0 0 12px 0;
                font-size: 32px;
            }

            .flip-card-back p{
                margin: 6px 0;
                font-size: 16px;
            }

            @media screen and (max-width: 600px) {
                .navbar {
                    width: min(100%, calc(100% - 20px));
                    top: 10px;
                    left: 50%;
                    transform: translateX(-50%);
                }

                .flip-card {
                    width: 280px;
                    height: 280px;
                }

                .flip-card-front img {
                    width: 280px !important;
                    height: 280px !important;
                }

                .flip-card-back {
                    width: 280px !important;
                    height: 280px !important;
                }

                .flip-card-back h1 {
                    font-size: 24px;
                }

                .flip-card-back p {
                    font-size: 14px;
                }
            }
        </style>
    </head>
    <body>
        <nav class="navbar">
        <!--Avatar-->
        <img src="img/salaf.jpg" alt="salafi" class="avatar">
        </nav>

        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <img src="img/salaf.jpg" alt="Avatar" style="width:300px;height:300px;border-radius: 8px;">
                </div>
                <div class="flip-card-back">
                    <h1>ابن</h1> 
                    <p>Religius and programmer</p> 
                    <p>Al-Qur'an dan As-Sunnah ☝</p>
                </div>
            </div>
        </div>
    </body>
</html>
